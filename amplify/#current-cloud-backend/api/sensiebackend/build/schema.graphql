type User {
  id: ID!
  owner: ID!
  firstName: String!
  lastName: String!
  email: String!
  dob: String!
  gender: String!
  domHand: String!
  goal: String!
  orgId: ID!
  affirmations(filter: ModelAffirmationFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelAffirmationConnection
  organization: Organization
  groupId: ID!
  group: Group
  sensies(filter: ModelSensieFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelSensieConnection
  picture: Picture
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Organization {
  id: ID!
  name: String!
  orgType: String!
  location: String!
  tier: String!
  teams(filter: ModelTeamFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelTeamConnection
  users(filter: ModelUserFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelUserConnection
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Team {
  id: ID!
  name: String!
  description: String!
  organizationId: ID
  organization: Organization
  users(filter: ModelUserFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelUserConnection
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Group {
  id: ID!
  name: String!
  description: String!
  users(filter: ModelUserFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelUserConnection
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Sensie {
  id: ID!
  userId: ID
  user: User
  owner: ID!
  timestamp: String!
  accelerometerData: String
  accelerometerResult: String
  gyroscopeData: String
  gyroscopeResult: String
  swipeData: String
  swipeResult: String
  voiceData: String
  voiceResult: String
  data: String!
  dataType: String!
  confidence: Float
  calibration: Boolean
  result: String
  userAgreement: Boolean
  affirmationId: ID!
  affirmation: Affirmation
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Topic {
  id: ID!
  name: String!
  description: String!
  affirmations(name: ModelStringKeyConditionInput, filter: ModelAffirmationFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelAffirmationConnection
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Affirmation {
  id: ID!
  topicId: ID!
  name: String!
  description: String!
  userId: ID!
  user: User
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type S3Object {
  bucket: String!
  region: String!
  key: String!
}

type Picture {
  id: ID!
  name: String
  owner: ID
  file: S3Object
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

enum ModelSortDirection {
  ASC
  DESC
}

type ModelUserConnection {
  items: [User]
  nextToken: String
}

input ModelStringInput {
  ne: String
  eq: String
  le: String
  lt: String
  ge: String
  gt: String
  contains: String
  notContains: String
  between: [String]
  beginsWith: String
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
  size: ModelSizeInput
}

input ModelIDInput {
  ne: ID
  eq: ID
  le: ID
  lt: ID
  ge: ID
  gt: ID
  contains: ID
  notContains: ID
  between: [ID]
  beginsWith: ID
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
  size: ModelSizeInput
}

input ModelIntInput {
  ne: Int
  eq: Int
  le: Int
  lt: Int
  ge: Int
  gt: Int
  between: [Int]
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelFloatInput {
  ne: Float
  eq: Float
  le: Float
  lt: Float
  ge: Float
  gt: Float
  between: [Float]
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelBooleanInput {
  ne: Boolean
  eq: Boolean
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelSizeInput {
  ne: Int
  eq: Int
  le: Int
  lt: Int
  ge: Int
  gt: Int
  between: [Int]
}

input ModelUserFilterInput {
  id: ModelIDInput
  owner: ModelIDInput
  firstName: ModelStringInput
  lastName: ModelStringInput
  email: ModelStringInput
  dob: ModelStringInput
  gender: ModelStringInput
  domHand: ModelStringInput
  goal: ModelStringInput
  orgId: ModelIDInput
  groupId: ModelIDInput
  and: [ModelUserFilterInput]
  or: [ModelUserFilterInput]
  not: ModelUserFilterInput
}

enum ModelAttributeTypes {
  binary
  binarySet
  bool
  list
  map
  number
  numberSet
  string
  stringSet
  _null
}

type Query {
  getUser(id: ID!): User
  listUsers(filter: ModelUserFilterInput, limit: Int, nextToken: String): ModelUserConnection
  getOrganization(id: ID!): Organization
  listOrganizations(filter: ModelOrganizationFilterInput, limit: Int, nextToken: String): ModelOrganizationConnection
  getTeam(id: ID!): Team
  listTeams(filter: ModelTeamFilterInput, limit: Int, nextToken: String): ModelTeamConnection
  getGroup(id: ID!): Group
  listGroups(filter: ModelGroupFilterInput, limit: Int, nextToken: String): ModelGroupConnection
  getSensie(id: ID!): Sensie
  listSensies(filter: ModelSensieFilterInput, limit: Int, nextToken: String): ModelSensieConnection
  getTopic(id: ID!): Topic
  listTopics(filter: ModelTopicFilterInput, limit: Int, nextToken: String): ModelTopicConnection
  getAffirmation(id: ID!): Affirmation
  listAffirmations(filter: ModelAffirmationFilterInput, limit: Int, nextToken: String): ModelAffirmationConnection
  getPicture(id: ID!): Picture
  listPictures(filter: ModelPictureFilterInput, limit: Int, nextToken: String): ModelPictureConnection
}

