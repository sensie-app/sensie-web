}

type Mutation {
  createUser(input: CreateUserInput!, condition: ModelUserConditionInput): User
  updateUser(input: UpdateUserInput!, condition: ModelUserConditionInput): User
  deleteUser(input: DeleteUserInput!, condition: ModelUserConditionInput): User
  createOrganization(input: CreateOrganizationInput!, condition: ModelOrganizationConditionInput): Organization
  updateOrganization(input: UpdateOrganizationInput!, condition: ModelOrganizationConditionInput): Organization
  deleteOrganization(input: DeleteOrganizationInput!, condition: ModelOrganizationConditionInput): Organization
  createTeam(input: CreateTeamInput!, condition: ModelTeamConditionInput): Team
  updateTeam(input: UpdateTeamInput!, condition: ModelTeamConditionInput): Team
  deleteTeam(input: DeleteTeamInput!, condition: ModelTeamConditionInput): Team
  createGroup(input: CreateGroupInput!, condition: ModelGroupConditionInput): Group
  updateGroup(input: UpdateGroupInput!, condition: ModelGroupConditionInput): Group
  deleteGroup(input: DeleteGroupInput!, condition: ModelGroupConditionInput): Group
  createSensie(input: CreateSensieInput!, condition: ModelSensieConditionInput): Sensie
  updateSensie(input: UpdateSensieInput!, condition: ModelSensieConditionInput): Sensie
  deleteSensie(input: DeleteSensieInput!, condition: ModelSensieConditionInput): Sensie
  createTopic(input: CreateTopicInput!, condition: ModelTopicConditionInput): Topic
  updateTopic(input: UpdateTopicInput!, condition: ModelTopicConditionInput): Topic
  deleteTopic(input: DeleteTopicInput!, condition: ModelTopicConditionInput): Topic
  createAffirmation(input: CreateAffirmationInput!, condition: ModelAffirmationConditionInput): Affirmation
  updateAffirmation(input: UpdateAffirmationInput!, condition: ModelAffirmationConditionInput): Affirmation
  deleteAffirmation(input: DeleteAffirmationInput!, condition: ModelAffirmationConditionInput): Affirmation
  createPicture(input: CreatePictureInput!, condition: ModelPictureConditionInput): Picture
  updatePicture(input: UpdatePictureInput!, condition: ModelPictureConditionInput): Picture
  deletePicture(input: DeletePictureInput!, condition: ModelPictureConditionInput): Picture
}

input ModelUserConditionInput {
  owner: ModelIDInput
  firstName: ModelStringInput
  lastName: ModelStringInput
  email: ModelStringInput
  dob: ModelStringInput
  gender: ModelStringInput
  domHand: ModelStringInput
  goal: ModelStringInput
  orgId: ModelIDInput
  groupId: ModelIDInput
  and: [ModelUserConditionInput]
  or: [ModelUserConditionInput]
  not: ModelUserConditionInput
}

type Subscription {
  onCreateUser: User @aws_subscribe(mutations: ["createUser"])
  onUpdateUser: User @aws_subscribe(mutations: ["updateUser"])
  onDeleteUser: User @aws_subscribe(mutations: ["deleteUser"])
  onCreateOrganization: Organization @aws_subscribe(mutations: ["createOrganization"])
  onUpdateOrganization: Organization @aws_subscribe(mutations: ["updateOrganization"])
  onDeleteOrganization: Organization @aws_subscribe(mutations: ["deleteOrganization"])
  onCreateTeam: Team @aws_subscribe(mutations: ["createTeam"])
  onUpdateTeam: Team @aws_subscribe(mutations: ["updateTeam"])
  onDeleteTeam: Team @aws_subscribe(mutations: ["deleteTeam"])
  onCreateGroup: Group @aws_subscribe(mutations: ["createGroup"])
  onUpdateGroup: Group @aws_subscribe(mutations: ["updateGroup"])
  onDeleteGroup: Group @aws_subscribe(mutations: ["deleteGroup"])
  onCreateSensie: Sensie @aws_subscribe(mutations: ["createSensie"])
  onUpdateSensie: Sensie @aws_subscribe(mutations: ["updateSensie"])
  onDeleteSensie: Sensie @aws_subscribe(mutations: ["deleteSensie"])
  onCreateTopic: Topic @aws_subscribe(mutations: ["createTopic"])
  onUpdateTopic: Topic @aws_subscribe(mutations: ["updateTopic"])
  onDeleteTopic: Topic @aws_subscribe(mutations: ["deleteTopic"])
  onCreateAffirmation: Affirmation @aws_subscribe(mutations: ["createAffirmation"])
  onUpdateAffirmation: Affirmation @aws_subscribe(mutations: ["updateAffirmation"])
  onDeleteAffirmation: Affirmation @aws_subscribe(mutations: ["deleteAffirmation"])
  onCreatePicture(owner: String!): Picture @aws_subscribe(mutations: ["createPicture"])
  onUpdatePicture(owner: String!): Picture @aws_subscribe(mutations: ["updatePicture"])
  onDeletePicture(owner: String!): Picture @aws_subscribe(mutations: ["deletePicture"])
}

